# Builds the page under web/ from this repository's source and publishes it with GitHub Pages.
name: Publish the page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a running one is allowed to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build the page
        run: |
          if [ -f web/vite.config.ts ]; then
            npm run build:web
          else
            # until web/ is in the repository: a notice in its place
            mkdir -p dist-web
            cp .github/pages/placeholder.html dist-web/index.html
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
