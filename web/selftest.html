<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>pear.js selftest</title>
    <style>
      :root { font-family: system-ui, -apple-system, sans-serif; }
      body { max-width: 64em; margin: 2em auto; padding: 0 1em; }
      h1 { font-size: 1.4em; }
      table { border-collapse: collapse; width: 100%; margin: 1em 0; }
      th, td { border: 1px solid light-dark(#ccc, #555); padding: 0.4em 0.8em; text-align: left; }
      th { background: light-dark(#f5f5f5, #2a2a2a); }
      tr.pass td:first-child { border-left: 3px solid #2a2; }
      tr.fail td:first-child { border-left: 3px solid #c22; }
      .error { color: #c22; }
      #selftest-status { font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>pear.js selftest</h1>
    <p>Replays committed fixtures in the browser and compares with the library's output.</p>
    <p id="selftest-status">Loading...</p>
    <div id="selftest-results"></div>
    <script type="module" src="./src/selftest.ts"></script>
  </body>
</html>
